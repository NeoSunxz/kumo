{% extends "base.html" %}
{% block title %}日志 - kumo{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>日志</h1><p class="lead">最近 300 条</p></div>
  <div class="actions"><a class="btn" href="/events">刷新</a></div>
</div>
<div class="card flush">
  <div class="scroll"><table>
    <tr><th>时间</th><th>级别</th><th>内容</th></tr>
    {% for e in events %}
    <tr><td class="muted small nowrap">{{ e.at|ts }}</td><td><span class="lvl lvl-{{ e.level|lower }}">{{ e.level }}</span></td><td class="break small">{{ e.message }}</td></tr>
    {% else %}
    <tr><td colspan="3"><div class="empty">暂无日志</div></td></tr>
    {% endfor %}
  </table></div>
</div>
{% endblock %}
